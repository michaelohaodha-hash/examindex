name: Generate papers manifest

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate manifest
        run: python scripts/generate_manifest.py

      - name: Commit manifest if it changed
        run: |
          git config user.name "examindex-bot"
          git config user.email "actions@github.com"
          git add data/papers-manifest.json
          git diff --staged --quiet || git commit -m "Auto-update papers manifest"
          git push
